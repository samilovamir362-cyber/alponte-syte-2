<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Al Ponte Restaurant & Lounge — Меню</title>
  <style>
    :root {
      --primary: #d4af37;
      --primary-neon: #e10098;
      --bg-dark: #0f0d0e;
      --card-bg: rgba(26, 23, 24, 0.85);
      --text-light: #f5f5f5;
      --text-muted: #aaa;
      --rate-usd: 0.0021; /* 1 KZT = 0.0021 USD */
      --rate-eur: 0.0019; /* 1 KZT = 0.0019 EUR */
      --rate-cny: 0.015;  /* 1 KZT = 0.015 CNY */
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-light); overflow-x: hidden; position: relative; }

    /* Декоративные рисунки по бокам */
    .side-decor {
      position: fixed;
      top: 0;
      width: 140px;
      height: 100vh;
      pointer-events: none;
      z-index: 1;
      opacity: 0.25;
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      align-items: center;
    }
    .side-decor.left { left: 10px; }
    .side-decor.right { right: 10px; }
    .decor-icon {
      width: 70px;
      height: 70px;
      fill: var(--primary);
      animation: float 6s ease-in-out infinite;
    }
    .side-decor.right .decor-icon { animation-delay: 3s; }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-15px) rotate(5deg); }
    }

    /* Главный баннер с фото */
    .hero {
      height: 100vh;
      background: linear-gradient(to bottom, rgba(15, 13, 14, 0.4), var(--bg-dark)), url('bg-hero.jpg') center/cover no-repeat;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      position: relative;
      z-index: 2;
    }

    .hero-title {
      font-size: 3.2rem;
      color: #fff;
      text-shadow: 0 0 15px rgba(225, 0, 152, 0.8), 0 0 30px rgba(225, 0, 152, 0.5);
      margin-bottom: 10px;
      font-weight: 700;
    }

    .hero-subtitle {
      font-size: 1.5rem;
      color: var(--primary);
      margin-bottom: 30px;
      letter-spacing: 2px;
    }

    .btn-menu {
      padding: 15px 35px;
      font-size: 1.2rem;
      background: linear-gradient(45deg, var(--primary-neon), var(--primary));
      color: #fff;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(225, 0, 152, 0.4);
      transition: all 0.3s ease;
      text-decoration: none;
    }
    .btn-menu:hover { transform: scale(1.08); box-shadow: 0 6px 20px rgba(225, 0, 152, 0.7); }

    /* Переключатель языка */
    .lang-picker {
      position: sticky;
      top: 0;
      background: rgba(15, 13, 14, 0.95);
      backdrop-filter: blur(8px);
      padding: 15px;
      display: flex;
      justify-content: center;
      gap: 15px;
      z-index: 100;
      border-bottom: 1px solid rgba(212, 175, 55, 0.2);
    }

    .lang-btn {
      background: transparent;
      border: 1px solid var(--primary);
      color: var(--primary);
      padding: 8px 18px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.3s;
    }
    .lang-btn.active, .lang-btn:hover {
      background: var(--primary);
      color: #000;
    }

    /* Контейнер меню */
    .menu-container {
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
      position: relative;
      z-index: 2;
    }

    /* Карточка блюда */
    .menu-item {
      background: var(--card-bg);
      border: 1px solid rgba(212, 175, 55, 0.15);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
      cursor: pointer;
    }

    .menu-item:hover {
      transform: translateY(-4px);
      border-color: var(--primary);
      box-shadow: 0 8px 25px rgba(212, 175, 55, 0.15);
    }

    /* Стилизация текста перевода (крупнее) и русского (меньше) */
    .title-translated {
      font-size: 1.4rem;
      font-weight: 700;
      color: #fff;
      display: block;
      margin-bottom: 4px;
    }

    .title-ru {
      font-size: 0.95rem;
      color: var(--text-muted);
      display: block;
      margin-bottom: 8px;
    }

    .desc-translated {
      font-size: 1.05rem;
      color: #ddd;
    }

    .desc-ru {
      font-size: 0.85rem;
      color: #888;
    }

    /* Блок цен */
    .price-box {
      text-align: right;
      min-width: 130px;
    }

    .price-kzt {
      font-size: 1.1rem;
      color: var(--text-muted);
      display: block;
    }

    .price-foreign {
      font-size: 1.35rem;
      font-weight: bold;
      color: var(--primary);
      display: block;
    }

    /* Адаптивность для мобильных */
    @media (max-width: 768px) {
      .side-decor { display: none; }
      .hero-title { font-size: 2.2rem; }
      .menu-item { flex-direction: column; align-items: flex-start; gap: 15px; }
      .price-box { text-align: left; }
    }
  </style>
</head>
